name: release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Run tests
        run: go test ./...

      # Runs before semantic-release tags anything and before GoReleaser builds
      # anything, so a binary that outgrew maxDownloadBytes aborts the release
      # instead of shipping an update nobody can install.
      - name: Check binaries fit the self-update download cap
        run: scripts/check-download-cap.sh

      - name: Semantic Release
        id: semrel
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: true

      - name: Fetch tag
        if: steps.semrel.outputs.version != ''
        run: git fetch --tags --force

      - name: Clean up semantic-release artifacts
        if: steps.semrel.outputs.version != ''
        run: rm -rf .generated-go-semantic-release-changelog.md .semrel/

      - name: Run GoReleaser
        if: steps.semrel.outputs.version != ''
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.semrel.outputs.version }}

  stamp:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Stamp release artifacts on Gridcoin
        uses: gridcat/gridcoin-stamp-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ needs.release.outputs.version }}
          wait-for-confirmation: false

  # Rebuild the wallet Docker images so they bundle this release now
  # instead of on the next weekly run. WALLET_IMAGES_TOKEN is a
  # fine-grained PAT with Actions: write on gridcat/grc-wallet-images
  # (GITHUB_TOKEN can't trigger workflows in another repo).
  rebuild-images:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch grc-wallet-images publish
        env:
          TOKEN: ${{ secrets.WALLET_IMAGES_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gridcat/grc-wallet-images/actions/workflows/publish.yml/dispatches \
            -d '{"ref":"master"}'
